# Builds the Cwrdd image (Cal.diy + our branding) and stores it in this repository's package registry.
# Takes roughly 30–60 minutes. The Cal.diy version it builds from is the commit named in the CAL_REF file.
name: Build Cwrdd
on:
  # A build starts when a tag named build-<something> is pushed, e.g. build-2026-11-26. It can also be started by hand.
  push:
    tags: ["build-*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:15-alpine
        env: { POSTGRES_USER: cal, POSTGRES_PASSWORD: buildonly, POSTGRES_DB: cal }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cal" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: calcom/cal.diy, path: cal, fetch-depth: 0 }
      - name: Use the Cal.diy version named in CAL_REF
        run: git -C cal checkout "$(cat CAL_REF)"
      - name: Apply Stori Cymru branding
        run: sh apply-branding.sh cal
      - name: Make room (extra swap and disk for the build)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo fallocate -l 10G /mnt/extra.swap && sudo chmod 600 /mnt/extra.swap && sudo mkswap /mnt/extra.swap && sudo swapon /mnt/extra.swap
          free -g; df -h /
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build the image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')"
          TAG="${GITHUB_REF_NAME#build-}"; [ "$GITHUB_REF_TYPE" = tag ] || TAG="manual-${GITHUB_RUN_NUMBER}"
          docker build cal --network host \
            --build-arg DATABASE_URL=postgresql://cal:buildonly@localhost:5432/cal \
            --build-arg NEXT_PUBLIC_LICENSE_CONSENT=agree \
            --build-arg CALCOM_TELEMETRY_DISABLED=1 \
            --build-arg NEXT_PUBLIC_APP_NAME="Cwrdd" \
            --build-arg NEXT_PUBLIC_COMPANY_NAME="Stori Cymru" \
            --build-arg NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS=info@stori.cymru \
            --build-arg NEXT_PUBLIC_WEBSITE_URL=https://stori.cymru \
            --build-arg NEXT_PUBLIC_DISABLE_SIGNUP=true \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Built $IMAGE:$TAG from Cal.diy $(cat CAL_REF)" >> "$GITHUB_STEP_SUMMARY"
