# Builds the Stori Cymru Meeting image (Cal.diy + our branding) and stores it in this repository's package registry.
# Start it by hand: Actions → "Build Stori Cymru Meeting" → Run workflow. Takes roughly 30–60 minutes.
name: Build Stori Cymru Meeting
on:
  workflow_dispatch:
    inputs:
      cal_ref:
        description: Cal.diy commit or tag to build from
        default: ae027bb70e694e2d2c44569f398d6cbcee0389b1
      tag:
        description: Name for this build (e.g. 2026-11-26)
        required: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    services:
      postgres:
        image: postgres:15-alpine
        env: { POSTGRES_USER: cal, POSTGRES_PASSWORD: buildonly, POSTGRES_DB: cal }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cal" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: calcom/cal.diy, ref: "${{ inputs.cal_ref }}", path: cal }
      - name: Apply Stori Cymru branding
        run: sh apply-branding.sh cal
      - name: Make room (extra swap and disk for the build)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo fallocate -l 10G /mnt/extra.swap && sudo chmod 600 /mnt/extra.swap && sudo mkswap /mnt/extra.swap && sudo swapon /mnt/extra.swap
          free -g; df -h /
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build the image
        run: |
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')"
          docker build cal --network host \
            --build-arg DATABASE_URL=postgresql://cal:buildonly@localhost:5432/cal \
            --build-arg NEXT_PUBLIC_LICENSE_CONSENT=agree \
            --build-arg CALCOM_TELEMETRY_DISABLED=1 \
            --build-arg NEXT_PUBLIC_APP_NAME="Stori Cymru Meeting" \
            --build-arg NEXT_PUBLIC_COMPANY_NAME="Stori Cymru" \
            --build-arg NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS=info@stori.cymru \
            --build-arg NEXT_PUBLIC_WEBSITE_URL=https://stori.cymru \
            -t "$IMAGE:${{ inputs.tag }}" -t "$IMAGE:latest"
          docker push "$IMAGE:${{ inputs.tag }}"
          docker push "$IMAGE:latest"
          echo "Built $IMAGE:${{ inputs.tag }} from Cal.diy ${{ inputs.cal_ref }}" >> "$GITHUB_STEP_SUMMARY"
